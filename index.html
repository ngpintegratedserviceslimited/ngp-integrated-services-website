<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="NGP Integrated Services Limited — integrated professional solutions across facility management, events, cleaning, security, ICT, telecoms, borehole drilling, construction, transportation and more.">
<meta name="theme-color" content="#1428d4">
<title>NGP Integrated Services Limited | Integrated Professional Solutions</title>
<style>
:root{--blue:#1428d4;--blue2:#0b1ca3;--red:#ed1717;--ink:#171a29;--muted:#626878;--light:#f5f7fb;--line:#e6e8ef;--white:#fff;--shadow:0 18px 55px rgba(18,27,70,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.65;background:#fff}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.container{width:min(1160px,92%);margin:auto}
header{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:30px}
.brand{display:flex;align-items:center;gap:12px;font-family:Georgia,serif;font-weight:700;font-size:24px}
.brand img{width:55px;height:55px;object-fit:contain}
.brand b{color:#111} .brand strong{color:var(--red)}
nav{display:flex;align-items:center;gap:28px;font-weight:700;color:#3e4352}
nav a:hover{color:var(--blue)}
.nav-cta{background:var(--blue);color:#fff!important;padding:13px 20px;border-radius:30px}
.hero{background:radial-gradient(circle at 82% 45%,rgba(20,40,212,.12),transparent 34%),linear-gradient(135deg,#fff 0%,#f2f5ff 100%);min-height:620px;display:flex;align-items:center;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center;padding:72px 0}
.eyebrow{color:var(--blue);font-size:14px;font-weight:800;letter-spacing:2px;margin-bottom:18px}
h1{font-family:Georgia,serif;font-size:clamp(50px,7vw,88px);line-height:.98;letter-spacing:-3px;max-width:700px}
h1 .red{color:var(--red)}
.hero p{font-size:18px;color:var(--muted);max-width:610px;margin:25px 0 30px}
.actions{display:flex;gap:13px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 23px;border-radius:9px;font-weight:800;border:1px solid transparent}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 10px 25px rgba(20,40,212,.2)}
.btn-outline{border-color:#cfd4e2;background:#fff}
.hero-art{min-height:440px;border-radius:30px;background:linear-gradient(145deg,#101b9d,#1d39ed);position:relative;box-shadow:var(--shadow);overflow:hidden}
.hero-art:before{content:"";position:absolute;width:390px;height:390px;border:58px solid rgba(255,255,255,.92);border-radius:50%;right:-120px;top:-100px}
.hero-art:after{content:"NGP";position:absolute;font-family:Georgia,serif;font-weight:900;font-size:180px;color:rgba(255,255,255,.1);bottom:-35px;left:25px}
.hero-logo{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.hero-logo img{width:min(300px,65%);filter:drop-shadow(0 20px 25px rgba(0,0,0,.18));background:#fff;border-radius:18px;padding:18px}
.stats{background:#11162a;color:#fff}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);padding:25px 0}
.stat{padding:12px 25px;border-right:1px solid rgba(255,255,255,.13);text-align:center}
.stat:last-child{border:0} .stat strong{font-size:28px;color:#fff} .stat span{display:block;color:#c4c9d8;font-size:13px}
.section{padding:90px 0}
.section-head{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:38px}
.kicker{color:var(--red);font-weight:900;letter-spacing:1.5px;font-size:13px}
h2{font-family:Georgia,serif;font-size:clamp(38px,5vw,60px);line-height:1.05;margin-top:8px}
.section-head p{max-width:500px;color:var(--muted)}
.about{background:var(--light)}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:55px;align-items:center}
.about-box{background:#fff;border-radius:24px;padding:35px;box-shadow:var(--shadow)}
.about-box img{width:100%;height:360px;object-fit:cover;border-radius:18px}
.about-copy p{color:var(--muted);margin:16px 0}
.checks{display:grid;gap:12px;margin-top:25px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:700} .check i{color:var(--blue);font-style:normal}
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.service-card{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff;transition:.25s;box-shadow:0 5px 20px rgba(20,25,60,.04)}
.service-card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
.service-img{height:190px;background-size:cover;background-position:center;position:relative}
.service-img:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.48))}
.service-num{position:absolute;z-index:2;right:15px;top:14px;background:#fff;color:var(--blue);font-weight:900;border-radius:20px;padding:5px 10px;font-size:12px}
.service-body{padding:23px} .service-body h3{font-size:21px} .service-body p{color:var(--muted);font-size:14px;margin:9px 0 15px} .service-body a{color:var(--blue);font-weight:800}
.details{background:#10152a;color:#fff} .details h2{color:#fff}
.detail-list{display:grid;grid-template-columns:1fr 1fr;gap:0 55px}
.detail-row{display:grid;grid-template-columns:55px 1fr;gap:18px;padding:24px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.detail-row>span{font-weight:900;color:#6f82ff} .detail-row h3{font-size:19px} .detail-row p{color:#b9bfd0;font-size:14px;margin-top:5px}
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.why{padding:30px;border:1px solid var(--line);border-radius:20px} .why .icon{width:48px;height:48px;border-radius:14px;background:#edf0ff;color:var(--blue);display:grid;place-items:center;font-weight:900;margin-bottom:18px} .why p{color:var(--muted);margin-top:8px}
.cta{padding:65px 0;background:linear-gradient(120deg,var(--blue),#293ce0);color:#fff}
.cta-grid{display:flex;justify-content:space-between;align-items:center;gap:30px} .cta h2{font-size:46px} .cta p{color:#dce1ff;margin-top:8px} .cta .btn{background:#fff;color:var(--blue)}
.contact{background:var(--light)} .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:50px}
.contact-card{background:#fff;border-radius:22px;padding:35px;box-shadow:var(--shadow)}
.contact-item{padding:17px 0;border-bottom:1px solid var(--line)} .contact-item:last-child{border:0} .contact-item small{display:block;color:var(--muted);font-weight:700} .contact-item a{color:var(--blue);font-weight:800;word-break:break-word}
footer{background:#0d1223;color:#d8dbea;padding:45px 0 25px} .foot-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:40px} footer .brand{color:#fff} footer .brand b{color:#fff} footer p{color:#aeb5c8;margin-top:12px;font-size:14px} footer h4{color:#fff;margin-bottom:12px} footer a{display:block;color:#b9bfd0;margin:7px 0;font-size:14px} .copy{border-top:1px solid rgba(255,255,255,.1);margin-top:30px;padding-top:20px;font-size:13px;color:#8e96aa}
.float-wa,.float-call{position:fixed;right:22px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;z-index:999;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.float-wa{bottom:22px;background:#10a85a} .float-call{bottom:92px;background:var(--blue)}
.mobile-menu{display:none}
@media(max-width:900px){
 nav{display:none} .mobile-menu{display:block;background:none;border:0;font-size:28px}
 .hero-grid,.about-grid,.contact-grid{grid-template-columns:1fr} .hero{min-height:auto} .hero-art{min-height:330px}
 .services-grid{grid-template-columns:1fr 1fr} .detail-list{grid-template-columns:1fr} .why-grid{grid-template-columns:1fr 1fr}
 .stats-grid{grid-template-columns:1fr 1fr} .stat:nth-child(2){border-right:0}
 .cta-grid{flex-direction:column;align-items:flex-start} .foot-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
 .brand{font-size:18px} .brand img{width:45px;height:45px} .hero-grid{padding:55px 0} h1{letter-spacing:-1.8px}
 .services-grid,.why-grid,.foot-grid{grid-template-columns:1fr} .section{padding:65px 0} .stats-grid{grid-template-columns:1fr 1fr}
 .stat{border-right:1px solid rgba(255,255,255,.13)} .stat:nth-child(2n){border-right:0}
 .hero-art{min-height:270px} .hero-logo img{width:220px}
}
</style>
</head>
<body>
<header>
  <div class="container nav">
    <a class="brand" href="#home" aria-label="NGP Integrated Services Limited">
      <img
